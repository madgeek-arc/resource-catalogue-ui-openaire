@if (!ready()) {
  <div class="whiteFilm">
    <i class="fa fa-spinner fa-spin fa-5x uk-position-center loader" aria-hidden="true"></i>
  </div>
}
@if (model()) {
  <div class="uk-section-default uk-section uk-section-small uk-padding-remove-bottom" style="min-height: 90vh;">
    <div class="uk-container uk-container-expand uk-margin-left uk-margin-right">
      @if (errorMessage()) {
        <!-- UIkit closes the alert itself; hidden then clears the message, or a later error would fill a removed box. -->
        <div #errorAlert id="formErrorAlert" tabindex="-1" class="uk-alert-danger" uk-alert (hidden)="errorMessage.set(null)">
          <button type="button" class="uk-alert-close" uk-close aria-label="Close"></button>
          <pre class="uk-alert-danger">{{errorMessage()}}</pre>
        </div>
      }
      <app-survey [payload]="payloadAnswer()" [model]="model()" [vocabulariesMap]="vocabulariesMap()" [tabsHeader]="null"
        [subVocabularies]="subVocabulariesMap()" (submit)="submitForm($event)" />
    </div>
  </div>
}
